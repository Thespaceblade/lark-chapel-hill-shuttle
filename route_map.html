const map = L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const colors = { express: '#0b6e4f', regular: '#b35c1e' };
const bounds = [];

function addIntended(key, route) {
  const color = colors[key];
  L.polyline(route.line, { color, weight: 5, opacity: 0.85, lineJoin: 'round' }).addTo(map);
  route.line.forEach(ll => bounds.push(ll));
  route.stops.forEach((s, i) => {
    const m = L.circleMarker([s.lat, s.lon], {
      radius: 7, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1
    }).addTo(map);
    m.bindPopup(`<strong>${key}: ${s.name}</strong><br/>Stop ${i+1}`);
    L.marker([s.lat, s.lon], {
      icon: L.divIcon({
        className: '',
        html: `<div class="stop-label">${i+1}. ${s.name.split('(')[0].trim()}</div>`,
        iconSize: [120, 18], iconAnchor: [-8, 9]
      })
    }).addTo(map);
    bounds.push([s.lat, s.lon]);
  });
}

function addPings(key, pings) {
  if (!pings || !pings.length) return;
  const color = colors[key];
  // faint trail of actual pings
  const latlngs = pings.map(p => [p.lat, p.lon]);
  L.polyline(latlngs, { color, weight: 2, opacity: 0.25, dashArray: '4 6' }).addTo(map);
  pings.forEach(p => {
    L.circleMarker([p.lat, p.lon], {
      radius: 4, color: '#fff', weight: 1, fillColor: color, fillOpacity: 0.75
    }).addTo(map).bindPopup(
      `<strong>${key} ping</strong><br/>${p.located_at}<br/>${p.entity_state || ''} ${p.speed || ''}<br/>${p.address || ''}`
    );
    bounds.push([p.lat, p.lon]);
  });
}

Object.entries(DATA.intended).forEach(([k, v]) => addIntended(k, v));
Object.entries(DATA.shuttles).forEach(([k, v]) => addPings(k, v));
if (bounds.length) map.fitBounds(bounds, { padding: [36, 36] });

const e = (DATA.shuttles.express || []).length;
const r = (DATA.shuttles.regular || []).length;
document.getElementById('meta').textContent =
  `${e} express pings · ${r} regular pings · routes via ${DATA.intended.express.source}/${DATA.intended.regular.source} · ${DATA.generated_at}`;
</script>
